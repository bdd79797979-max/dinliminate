<!doctype html>
<html lang="en">
<head>
<!-- CP1070 Restaurant refine controls -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="./viewport.js?v=1090"></script>
<meta name="theme-color" content="#090909">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dinliminate">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.webmanifest">

<title>Dinliminate — Meal Decisions Simplified</title>

<link rel="stylesheet" href="./styles.css?v=1090">
</head>
<body>
<main class="app">
<div class="offline-indicator hidden" id="offlineIndicator" role="status" aria-live="polite">Offline · saved meal choices still work</div>
<div class="storage-indicator hidden" id="storageIndicator" role="status" aria-live="polite">Could not save some changes on this device.</div>

<header class="top app-topbar" id="appTopbar">
  <div class="brand-mark" aria-label="Dinliminate">
    <img class="dinliminate-logo-symbol" src="./logo.svg?v=1089" alt="" aria-hidden="true">
    <span class="dinliminate-logo-wordmark">DINLIMINATE</span>
  </div>
  <button id="menu" class="menu" aria-label="Menu"><span></span><span></span><span></span></button>
</header>

<section class="screen home luxury-home" id="home">
<div class="home-intro"><h1>Meal Decisions Simplified</h1><p class="sub">Swipe. Refine. Enjoy.</p></div>
<div class="home-actions">
<button class="home-card home-card-choice food-choice" id="foodStart">
  <span class="home-card-copy"><strong>AT HOME</strong></span><span class="arrow" aria-hidden="true">›</span>
</button>
<button class="home-card home-card-choice restaurant-choice" id="restStart">
  <span class="home-card-copy"><strong>RESTAURANT</strong></span><span class="arrow" aria-hidden="true">›</span>
</button>
</div>
<div class="home-foot" aria-label="App tools">
  <div class="home-foot-actions">
    <button class="home-foot-action home-icon-action" id="addToPhone" data-home-action="add" type="button" aria-label="How to add Dinliminate to your phone" title="How to add to your phone">
      <svg class="home-foot-icon phone-plus-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <rect x="7.1" y="2.9" width="9.8" height="18.2" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.45"/>
        <path d="M10 5.5h4" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round"/>
        <path d="M12 17.2v4.1M9.95 19.25h4.1" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round"/>
      </svg>
      <span class="home-icon-label">Add to phone</span><span class="sr-only">How to add to your phone</span>
    </button>
    <button class="home-foot-action home-icon-action" id="shareApp" data-home-action="share" type="button" aria-label="Share Dinliminate" title="Share app">
      <svg class="home-foot-icon share-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <circle cx="6.1" cy="12.2" r="2.1" fill="none" stroke="currentColor" stroke-width="1.45"/>
        <circle cx="17.9" cy="6.2" r="2.1" fill="none" stroke="currentColor" stroke-width="1.45"/>
        <circle cx="17.9" cy="18.1" r="2.1" fill="none" stroke="currentColor" stroke-width="1.45"/>
        <path d="M8 11.2 16 7.1M8 13.2l8 4.1" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round"/>
      </svg>
      <span class="home-icon-label">Share app</span><span class="sr-only">Share app</span>
    </button>

    <button class="home-foot-action home-icon-action tutorial-mode-toggle" id="tutorialModeToggle" data-home-action="tutorial" type="button" aria-label="Tutorial Mode" title="Tutorial Mode">
      <svg class="home-foot-icon tutorial-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 6.5c2.8-1.4 5.2-1.1 7 0v11c-1.8-1.1-4.2-1.4-7 0v-11ZM19 6.5c-2.8-1.4-5.2-1.1-7 0v11c2.8-1.1 4.2-1.4 7 0v-11Z" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linejoin="round"/><path d="M12 7.1v10.3" fill="none" stroke="currentColor" stroke-width="1.1"/><path d="m12 3.6.65 1.35 1.5.22-1.08 1.05.25 1.49L12 7 10.68 7.7l.25-1.49-1.08-1.05 1.5-.22L12 3.6Z" fill="currentColor"/></svg><span class="home-icon-label">Tutorial</span>
    </button>  </div>
</div>
</section>


<section class="screen hidden family-screen" id="family">
  <div class="interior-nav family-interior-nav" aria-label="Dinner Together navigation">
    <div class="interior-center-label">DINNER TOGETHER</div>
    <button id="familyMenu" class="menu interior-menu" type="button" aria-label="Menu"><span></span><span></span><span></span></button>
  </div>

  <div class="family-page" id="familyPage">
    <div class="family-hero">
      <span class="family-kicker">DINNER TOGETHER</span>
      <h1>Dinner decisions.<br>Made together.</h1>
      <p>Decided together. No group chat required.</p>
