<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Dinliminate — meal photo fallback</title>
<desc id="desc">Minimal gold line-art dinner plate and cutlery on a matte black background.</desc>
<defs>
  <radialGradient id="matte" cx="50%" cy="42%" r="78%">
    <stop offset="0" stop-color="#171614"/>
    <stop offset="1" stop-color="#070707"/>
  </radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f0d9a1"/>
    <stop offset=".48" stop-color="#b99654"/>
    <stop offset="1" stop-color="#806337"/>
  </linearGradient>
  <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
  </filter>
</defs>
<rect width="1200" height="900" fill="url(#matte)"/>
<ellipse cx="600" cy="466" rx="292" ry="292" fill="none" stroke="#8c7040" stroke-width="2" opacity=".24"/>
<circle cx="600" cy="452" r="232" fill="none" stroke="url(#gold)" stroke-width="5"/>
<circle cx="600" cy="452" r="205" fill="none" stroke="url(#gold)" stroke-width="2.5" opacity=".72"/>
<circle cx="600" cy="452" r="177" fill="none" stroke="#b99654" stroke-width="1.5" opacity=".35"/>
<!-- Fork -->
<g fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)">
  <path d="M375 255v91c0 24 13 42 32 49v236"/>
  <path d="M347 255v61M375 255v61M403 255v61"/>
  <path d="M347 316c0 24 12 39 28 39s28-15 28-39"/>
</g>
<!-- Knife -->
<g fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
  <path d="M825 255c-29 26-39 65-39 106v34h39v236"/>
  <path d="M825 255v140"/>
</g>
<path d="M480 452h240" stroke="url(#gold)" stroke-width="1.5" opacity=".35"/>
<circle cx="600" cy="452" r="4" fill="#d7ba7a" opacity=".8"/>
<text x="600" y="104" text-anchor="middle" fill="#e6d2a5" font-family="Arial,sans-serif" font-size="30" font-weight="600" letter-spacing="10">DINLIMINATE</text>
<path d="M520 746h160" stroke="url(#gold)" stroke-width="2" opacity=".8"/>
<text x="600" y="790" text-anchor="middle" fill="#bfa16b" font-family="Arial,sans-serif" font-size="17" letter-spacing="5">MEAL PHOTO UNAVAILABLE</text>
</svg>
