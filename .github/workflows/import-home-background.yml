name: Import Home background

on:
  push:
    branches: [cp1093-home-background]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-home-background:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble new Home background
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(assets/home-door.parts/*.b64)
          if [ "${#parts[@]}" -eq 0 ]; then
            echo "No pending Home background parts; nothing to do."
            exit 0
          fi
          printf '%s\n' "${parts[@]}" | sort -V > /tmp/parts.txt
          : > /tmp/home-door.b64
          while IFS= read -r part; do cat "$part" >> /tmp/home-door.b64; done < /tmp/parts.txt
          base64 -d /tmp/home-door.b64 > assets/home-door.jpg
          identify assets/home-door.jpg 2>/dev/null || file assets/home-door.jpg
          test "$(stat -c%s assets/home-door.jpg)" -gt 10000
      - name: Remove temporary parts and commit image
        shell: bash
        run: |
          set -euo pipefail
          rm -rf assets/home-door.parts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/home-door.jpg
          git add -A assets/home-door.parts
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "CP1093: replace bundled Home background"
          git push
