name: Restaurant photo benchmark
# One-shot baseline execution is gated on a push commit containing [run-photo-baseline].

on:
  push:
    branches:
      - qa/restaurant-photo-step0-benchmark
  workflow_dispatch:
    inputs:
      base:
        description: Preview base URL (must have Google photos disabled)
        type: string
        required: true
      count:
        description: Number of unique restaurants to sample
        type: number
        required: true
        default: 200
      radius:
        description: Search radius in miles
        type: number
        required: true
        default: 10
      lat:
        description: Search center latitude
        type: string
        required: true
        default: "36.5298"
      lon:
        description: Search center longitude
        type: string
        required: true
        default: "-87.3595"

permissions:
  contents: read

jobs:
  benchmark:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-photo-baseline]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/restaurant-photo-step0-benchmark
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Format benchmark script
        run: npx prettier --write scripts/benchmark-restaurant-photos.mjs
      - name: Wait for branch preview with Google photos disabled
        env:
          BASE: ${{ inputs.base || 'https://dinliminate-git-qa-restaurant-photo-step0-benchmark-c-9ad9.vercel.app' }}
        run: |
          BASE="${BASE%/}"
          for attempt in $(seq 1 60); do
            headers="$(mktemp)"
            status="$(curl --silent --show-error --max-time 8 --dump-header "$headers" --output /dev/null --write-out '%{http_code}' "$BASE/api/restaurant-photo" 2>/dev/null || true)"
            if [ "$status" = "400" ] && grep -Eiq '^x-restaurant-photo-google:[[:space:]]*disabled' "$headers"; then
              echo "Preview serves the photo endpoint and explicitly reports Google photos disabled."
              rm -f "$headers"
              exit 0
            fi
            echo "Preview not ready (attempt $attempt/60; HTTP ${status:-no response}); waiting for the latest branch deployment and disabled header."
            rm -f "$headers"
            sleep 10
          done
          echo "Preview did not pass the routing/runtime/Google-disabled readiness check."
          exit 1
      - name: Run restaurant photo benchmark
        env:
          BASE: ${{ inputs.base || 'https://dinliminate-git-qa-restaurant-photo-step0-benchmark-c-9ad9.vercel.app' }}
          COUNT: ${{ inputs.count || 200 }}
          RADIUS: ${{ inputs.radius || 10 }}
          LAT: ${{ inputs.lat || '36.5298' }}
          LON: ${{ inputs.lon || '-87.3595' }}
        run: >-
          node scripts/benchmark-restaurant-photos.mjs
          --base "$BASE"
          --count "$COUNT"
          --radius "$RADIUS"
          --lat "$LAT"
          --lon "$LON"
          --out artifacts/restaurant-photo-baseline
      - name: Upload full report folder
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restaurant-photo-baseline
          path: artifacts/restaurant-photo-baseline/
          if-no-files-found: warn
          retention-days: 14
