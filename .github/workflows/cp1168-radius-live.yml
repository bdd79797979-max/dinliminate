name: CP1168 Radius Tile Live Test

on:
  push:
    branches:
      - cp1168-radius-tiles
  pull_request:
    branches:
      - main

jobs:
  live-radius:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Run radius geometry smoke
        run: node qa/cp1168-radius-tiles-smoke.cjs
      - name: Run live radius regression
        run: node qa/cp1168-radius-live.cjs