name: Dinliminate Release Candidate

on:
  workflow_dispatch:
  push:
    branches:
      - cp1086-automated-rc
      - cp1087-iphone-certification
      - cp1088-launch-candidate
      - cp1090-home-viewport
  pull_request:
    branches:
      - main

jobs:
  rc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Run release candidate gate
        run: npm run test:rc

      - name: Run CP1165 live radius verification
        run: node qa/cp1165-radius-live-verification.cjs
