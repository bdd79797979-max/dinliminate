name: Meal image audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "data/foods.js"
      - "qa/verify-meal-images.mjs"
      - "package.json"
      - "app.js"
      - "sw.js"
      - "qa/cp1155-meal-deck-never-stuck-smoke.cjs"

jobs:
  meal-image-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: node --check app.js
      - run: node qa/cp1155-meal-deck-never-stuck-smoke.cjs
      - run: npm run audit:meal-images
