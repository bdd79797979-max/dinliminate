<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Dinliminate · Development Diagnostics</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f2ec;margin:0;padding:32px;max-width:900px;margin-inline:auto}section{background:#fff;border:1px solid #ddd5c8;border-radius:12px;padding:14px;margin:10px 0}button{padding:10px 14px}</style></head><body><h1>Dinliminate Diagnostics</h1><p>Development-only checks.</p><button id="run" type="button">Run diagnostics</button><div id="results"></div><script type="module">const r=document.getElementById('results');document.getElementById('run').onclick=async()=>{r.textContent='';for(const [label,url] of [['Release','../../app-release.json'],['Manifest','../../release-manifest.json'],['Restaurant API','../../api/restaurants?mode=health'],['Google Budget','../../api/google-usage']]){const s=document.createElement('section'),b=document.createElement('b'),p=document.createElement('p');b.textContent=label;p.textContent='Checking…';s.append(b,p);r.appendChild(s);try{const x=await fetch(url+(url.includes('?')?'&':'?')+'diagnosis='+Date.now(),{cache:'no-store'}),d=await x.json();if(!x.ok)throw new Error('HTTP '+x.status);p.textContent=JSON.stringify(d);s.dataset.status='pass';}catch(error){p.textContent=String(error?.message||error||'Failed');s.dataset.status='fail';console.error('Dinliminate diagnostics',error);}}};document.getElementById('run').click();</script></body></html>
